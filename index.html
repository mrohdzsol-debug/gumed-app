<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema GUMED</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="theme-color" content="#1F4E79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GUMED">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{height:100%;margin:0}
  body{background:#F3F6F9;color:#16283D;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 16px;box-sizing:border-box}
  .caja{max-width:340px}
  .caja img{width:120px;height:120px;border-radius:24px;box-shadow:0 2px 10px rgba(22,40,61,.12)}
  .caja p{margin:16px 0 0;font-size:16px;color:#5B6E82}
  .caja b{display:block;margin-top:18px;font-size:18px}
  .caja button,.caja a{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:10px;font-size:16px;font-weight:600;text-decoration:none;border:0;cursor:pointer}
  .caja button{background:#1F4E79;color:#fff}
  .caja a{background:#E3EEF8;color:#1F4E79;margin-left:6px}
  .barra{width:140px;height:4px;margin:18px auto 0;background:#D6E0EA;border-radius:4px;overflow:hidden}
  .barra i{display:block;width:40%;height:100%;background:#1F4E79;border-radius:4px;animation:ir 1.1s ease-in-out infinite}
  @keyframes ir{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
</style>
</head>
<body>
<div class="caja" id="caja">
  <img src="icono-192.png" alt="GUMED Clean">
  <p>Cargando Sistema GUMED…</p>
  <div class="barra"><i></i></div>
</div>
<script>
(function () {
  "use strict";
  var API = "https://script.google.com/macros/s/AKfycbzDu4QCyEtIhQuz6svMoSnVbqQC8aGaHFA6tmbpttRTUfqqg5-Pf5EI84diW6rvsl-KGg/exec";
  var CLAVE = "gumed-app-pagina";

  /* Reemplaza google.script.run: cada llamada va al sistema por internet (doPost del Apps Script). */
  function puente(API) {
    function llamar(fn, args, ok, mal) {
      fetch(API, { method: "POST", body: JSON.stringify({ fn: fn, args: args }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) { if (ok) ok(j.r); }
          else { if (mal) mal(new Error((j && j.error) || "Error del sistema")); }
        })
        .catch(function (e) { if (mal) mal(e); });
    }
    function hacer(ok, mal) {
      return new Proxy({}, { get: function (_, k) {
        if (k === "withSuccessHandler") return function (f) { return hacer(f, mal); };
        if (k === "withFailureHandler") return function (f) { return hacer(ok, f); };
        if (k === "withUserObject") return function () { return hacer(ok, mal); };
        return function () { llamar(String(k), Array.prototype.slice.call(arguments), ok, mal); };
      } });
    }
    window.google = { script: { run: hacer(null, null) } };
    window.GUMED_APP = true;
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
    /* Botón "Instalar" (Android/Chrome): aparece solo si todavía no está instalada. */
    window.addEventListener("beforeinstallprompt", function (ev) {
      ev.preventDefault();
      var hasta = 0; try { hasta = Number(localStorage.getItem("gumed-app-instalar-no") || 0); } catch (e) {}
      if (Date.now() < hasta || document.getElementById("gumed-instalar")) return;
      var d = document.createElement("div");
      d.id = "gumed-instalar";
      d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99998;background:#1F4E79;color:#fff;border-radius:12px;padding:12px 14px;" +
        "display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:15px system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25)";
      d.innerHTML = '<span style="flex:1 1 180px">Instala GUMED en este teléfono: abre directo, sin buscar la liga.</span>' +
        '<button type="button" data-i="si" style="background:#fff;color:#1F4E79;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:15px">Instalar</button>' +
        '<button type="button" data-i="no" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:8px 10px;font-size:15px">Ahora no</button>';
      d.addEventListener("click", function (e) {
        var b = e.target.closest ? e.target.closest("[data-i]") : null; if (!b) return;
        if (b.getAttribute("data-i") === "si") { ev.prompt(); }
        else { try { localStorage.setItem("gumed-app-instalar-no", String(Date.now() + 7 * 864e5)); } catch (x) {} }
        d.remove();
      });
      (document.body || document.documentElement).appendChild(d);
    });
  }

  var EXTRA = '<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icono-192.png"><link rel="apple-touch-icon" href="icono-192.png">' +
    '<meta name="theme-color" content="#1F4E79"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="GUMED">' +
    "<script>(" + puente.toString() + ")(" + JSON.stringify(API) + ");<\/script>";

  function leer() { try { return JSON.parse(localStorage.getItem(CLAVE)); } catch (e) { return null; } }
  function guardar(j) { try { localStorage.setItem(CLAVE, JSON.stringify({ v: j.v, html: j.html, el: Date.now() })); } catch (e) {} }
  function pintar(html) {
    var h = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + EXTRA; }) : EXTRA + html;
    document.open(); document.write(h); document.close();
  }
  function avisoNueva() {
    if (document.getElementById("gumed-nueva")) return;
    var d = document.createElement("div");
    d.id = "gumed-nueva";
    d.setAttribute("role", "status");
    d.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#16283D;color:#fff;border-radius:12px;padding:12px 14px;" +
      "display:flex;gap:10px;align-items:center;justify-content:space-between;font:15px system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25)";
    d.innerHTML = '<span>Hay una versión nueva del sistema.</span><button type="button" style="background:#fff;color:#16283D;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:15px">Actualizar</button>';
    d.querySelector("button").onclick = function () { location.reload(); };
    (document.body || document.documentElement).appendChild(d);
  }
  function error() {
    document.getElementById("caja").innerHTML = '<img src="icono-192.png" alt="GUMED Clean"><b>No se pudo abrir el sistema</b>' +
      '<p>Revisa tu internet (datos o wifi) y vuelve a intentar.</p><button type="button" id="otra">Reintentar</button><a href="' + API + '">Abrir en el navegador</a>';
    document.getElementById("otra").onclick = function () { location.reload(); };
  }

  if (/[?&]reiniciar/.test(location.search)) { try { localStorage.removeItem(CLAVE); } catch (e) {} }
  var c = leer();
  var pide = fetch(API + "?api=pagina&v=" + encodeURIComponent((c && c.v) || ""), { cache: "no-store" })
    .then(function (r) { return r.json(); });

  if (c && c.html) {
    pide.then(function (j) { if (j && j.html && j.v !== c.v) { guardar(j); avisoNueva(); } }).catch(function () {});
    pintar(c.html);
  } else {
    pide.then(function (j) {
      if (!j || !j.html) throw new Error("sin página");
      guardar(j); pintar(j.html);
    }).catch(error);
  }
})();
</script>
</body>
</html>
